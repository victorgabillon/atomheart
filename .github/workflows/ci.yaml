name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox==4.56.1

    - name: Check out the validated Valanga source
      uses: actions/checkout@v4
      with:
        repository: victorgabillon/valanga
        ref: 2685ed9e79236ad707e2657f87f0ddc53953e4c7
        path: .ci-valanga

    - name: Build the Python 3.14 Valanga wheel
      run: |
        python -m pip install build==1.6.1
        python -m build --wheel --outdir "$RUNNER_TEMP/valanga-dist" .ci-valanga
        echo "VALANGA_WHEEL=$RUNNER_TEMP/valanga-dist/valanga-0.2.5-py3-none-any.whl" >> "$GITHUB_ENV"

    - name: Run tox
      run: tox


